spring.application.name=mysawit-payment
server.port=8002
jwt.secret=${JWT_SECRET}

spring.profiles.active=local

# JPA / HIBERNATE
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# XENDIT
xendit.secret-key=${XENDIT_SECRET_KEY}
xendit.base-url=https://api.xendit.co
xendit.webhook-token=${XENDIT_WEBHOOK_TOKEN}

# API KEY
internal.api-key=${INTERNAL_API_KEY}

payment.gateway=xendit

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.access=unrestricted
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,200ms,300ms,500ms,1s,2s,5s
