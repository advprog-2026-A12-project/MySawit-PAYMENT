name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build + Test + Lint + Coverage
        run: ./gradlew clean check jacocoTestReport

      - name: SonarCloud Analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-production:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Heroku Login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          machine git.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          EOF

      - name: Add Heroku remote
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: heroku git:remote -a $HEROKU_APP_NAME

      - name: Deploy to Heroku
        run: git push heroku main --force

      - name: Wait for deployment
        run: sleep 30

      - name: Health Check Production
        run: |
          curl --retry 5 --retry-delay 10 --fail https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com/actuator/health || exit 1

      - name: Notify Production Deployment
        run: echo "✅ Deployed to PRODUCTION → https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"