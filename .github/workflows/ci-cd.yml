name: CI-CD

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: payment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: mysawit_payment_test
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: paymentpassword
      POSTGRES_PORT: 5435
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mysawit_payment_test
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: paymentpassword
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U payment_user -d mysawit_payment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build + test + coverage
        run: ./gradlew clean check jacocoTestReport

      - name: Analyze with SonarCloud
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PAYMENT || secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_staging:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Heroku Login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          machine git.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          EOF

      - name: Add Heroku remote
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: heroku git:remote -a $HEROKU_APP_NAME

      - name: Deploy to Heroku
        run: git push heroku main --force

  deploy_production:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Validate Docker Hub configuration
        run: |
          test -n "${{ vars.DOCKERHUB_REPOSITORY }}" || (echo "Missing repository variable DOCKERHUB_REPOSITORY (example: username/mysawit-payment)" && exit 1)
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing secret DOCKERHUB_USERNAME" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing secret DOCKERHUB_TOKEN" && exit 1)

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate EC2 deployment configuration
        run: |
          test -n "${{ secrets.EC2_HOST }}" || (echo "Missing secret EC2_HOST" && exit 1)
          test -n "${{ secrets.EC2_USERNAME }}" || (echo "Missing secret EC2_USERNAME" && exit 1)
          test -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}" || (echo "Missing secret EC2_SSH_PRIVATE_KEY" && exit 1)

      - name: Deploy container to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
          CONTAINER_NAME: ${{ vars.EC2_CONTAINER_NAME || 'payment-app' }}
          HOST_PORT: ${{ vars.EC2_HOST_PORT || '8002' }}
          CONTAINER_PORT: ${{ vars.EC2_CONTAINER_PORT || '8002' }}
          DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR || '/opt/payment' }}
          ENV_FILE_PATH: ${{ vars.EC2_ENV_FILE_PATH || '/opt/payment/.env' }}
          HEALTHCHECK_URL: ${{ vars.EC2_HEALTHCHECK_URL || '' }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '8002' }}
          DATABASE_URL: ${{ vars.DATABASE_URL || '' }}
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME || '' }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY || '' }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN || '' }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || '' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,DEPLOY_DIR,ENV_FILE_PATH,HEALTHCHECK_URL,SPRING_PROFILES_ACTIVE,SERVER_PORT,DATABASE_URL,DATABASE_USERNAME,DATABASE_PASSWORD,JWT_SECRET,XENDIT_SECRET_KEY,XENDIT_WEBHOOK_TOKEN,INTERNAL_API_KEY
          script: |
            set -euo pipefail
            docker compose version >/dev/null 2>&1 || (echo "docker compose plugin is required on EC2 host" && exit 1)

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            : > .runtime.env
            for key in SPRING_PROFILES_ACTIVE SERVER_PORT DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET XENDIT_SECRET_KEY XENDIT_WEBHOOK_TOKEN INTERNAL_API_KEY; do
              val="${!key:-}"
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> .runtime.env
              fi
            done

            cat > docker-compose.yml <<EOF
            services:
              app:
                image: ${IMAGE}
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                ports:
                  - "${HOST_PORT}:${CONTAINER_PORT}"
            EOF

            if [ -n "${ENV_FILE_PATH:-}" ] && [ -f "$ENV_FILE_PATH" ]; then
              echo "Using env file: $ENV_FILE_PATH"
              cat >> docker-compose.yml <<EOF
                env_file:
                  - ${ENV_FILE_PATH}
                  - ./.runtime.env
            EOF
            else
              echo "ENV file not found or not set; deploying with GitHub-provided env only"
              cat >> docker-compose.yml <<'EOF'
                env_file:
                  - ./.runtime.env
            EOF
            fi

            docker compose pull app
            docker compose up -d --force-recreate app

            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Container is not running"
              docker compose ps
              docker compose logs --tail 200 app || true
              exit 1
            fi

            if [ -n "${HEALTHCHECK_URL}" ]; then
              i=1
              until [ "$i" -gt 12 ]
              do
                if curl -fsS --max-time 5 "$HEALTHCHECK_URL" >/dev/null; then
                  echo "Healthcheck passed: $HEALTHCHECK_URL"
                  break
                fi
                if [ "$i" -eq 12 ]; then
                  echo "Healthcheck failed: $HEALTHCHECK_URL"
                  docker compose logs --tail 200 app || true
                  exit 1
                fi
                sleep 5
                i=$((i+1))
              done
            fi

            docker image prune -f
