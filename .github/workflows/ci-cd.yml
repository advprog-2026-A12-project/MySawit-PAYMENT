name: CI-CD

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: payment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: mysawit_payment_test
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: paymentpassword
      POSTGRES_PORT: 5435
      INTERNAL_PATH_PREFIX: /api/v1/internal
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mysawit_payment_test
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: paymentpassword
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U payment_user -d mysawit_payment_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build + test + coverage
        run: ./gradlew clean check jacocoTestReport

      - name: Analyze with SonarCloud
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  payment-newman-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mysawit_payment_ci
          POSTGRES_USER: payment_user
          POSTGRES_PASSWORD: payment_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_user -d mysawit_payment_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # App URL for Newman
      PAYMENT_CI_BASE_URL: http://localhost:8002/api/v1

      # Spring database config used by the Payment app in CI.
      DB_URL: jdbc:postgresql://localhost:5432/mysawit_payment_ci
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_pass
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mysawit_payment_ci
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      INTERNAL_PATH_PREFIX: /api/v1/internal

      # CI-only security values. Do not replace these with prod secrets:
      # Newman reports can include request headers.
      PAYMENT_CI_JWT_SECRET: c3VwZXJzZWNyZXRzdXBlcnNlY3JldHN1cGVyc2VjcmV0
      INTERNAL_API_KEY: payment-ci-internal-key
      XENDIT_WEBHOOK_TOKEN: payment-ci-xendit-callback-token

      # Common alternative property names; harmless if your app ignores them.
      JWT_SECRET: c3VwZXJzZWNyZXRzdXBlcnNlY3JldHN1cGVyc2VjcmV0
      JWT_SECRET_KEY: c3VwZXJzZWNyZXRzdXBlcnNlY3JldHN1cGVyc2VjcmV0
      APP_JWT_SECRET: c3VwZXJzZWNyZXRzdXBlcnNlY3JldHN1cGVyc2VjcmV0

      # Xendit invoice creation is avoided by CI collection using a seeded top-up.
      XENDIT_SECRET_KEY: ci-dummy-xendit-key
      XENDIT_API_KEY: ci-dummy-xendit-key
      XENDIT_CALLBACK_TOKEN: payment-ci-xendit-callback-token

      # Fixed test identities matching generated JWTs and seed script.
      PAYMENT_CI_ADMIN_ID: dfedfa3b-eff2-49a4-bd8b-a69925c0a005
      PAYMENT_CI_BURUH_ID: dfedfa3b-eff2-49a4-bd8b-a69925c0a006
      PAYMENT_CI_TOPUP_ID: 50000000-0000-0000-0000-00000000c001
      PAYMENT_CI_CALLBACK_GATEWAY_ID: inv-ci-paid-001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl
          npm install -g newman newman-reporter-htmlextra

      - name: Validate CI config is present
        run: |
          test -n "$PAYMENT_CI_JWT_SECRET" || (echo "Missing PAYMENT_CI_JWT_SECRET" && exit 1)
          test -n "$INTERNAL_API_KEY" || (echo "Missing INTERNAL_API_KEY" && exit 1)
          test -n "$XENDIT_WEBHOOK_TOKEN" || (echo "Missing XENDIT_WEBHOOK_TOKEN" && exit 1)
          test -n "$SPRING_DATASOURCE_URL" || (echo "Missing SPRING_DATASOURCE_URL" && exit 1)

      - name: Build Payment app
        run: ./gradlew clean bootJar

      - name: Generate CI JWTs and Postman environment
        run: |
          python scripts/ci/generate-ci-jwts.py
          python scripts/ci/generate-postman-env.py

      - name: Start Payment app
        run: |
          mkdir -p build/ci

          APP_JAR=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          echo "Starting $APP_JAR"
          java -jar "$APP_JAR" --server.port=8002 > build/ci/payment-app.log 2>&1 &
          echo $! > build/ci/payment-app.pid

          echo "Waiting for app port 8002..."
          for i in {1..60}; do
            if bash -c '</dev/tcp/127.0.0.1/8002' 2>/dev/null; then
              echo "App is reachable"
              exit 0
            fi
            sleep 2
          done

          echo "App failed to start. Last logs:"
          tail -200 build/ci/payment-app.log || true
          exit 1

      - name: Seed CI database
        run: |
          psql -h localhost -p 5432 \
            -U "$SPRING_DATASOURCE_USERNAME" \
            -d mysawit_payment_ci \
            -v ON_ERROR_STOP=1 \
            -f scripts/ci/seed-payment-ci.sql
        env:
          PGPASSWORD: payment_pass

      - name: Run Newman Payment functional + security regression
        run: |
          mkdir -p build/newman
          newman run postman/MySawit-Payment.ci.postman_collection.json \
            -e build/ci/MySawit-Payment.ci.postman_environment.json \
            -r cli,junit,htmlextra \
            --reporter-junit-export build/newman/payment-regression.xml \
            --reporter-htmlextra-export build/newman/payment-regression.html

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-newman-regression-report
          path: |
            build/newman

      - name: Upload app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-app-ci-logs
          path: build/ci/payment-app.log

  deploy_staging:
    needs: [ci, payment-newman-regression]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Heroku Login
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          machine git.heroku.com
            login ${{ secrets.HEROKU_EMAIL }}
            password $HEROKU_API_KEY
          EOF

      - name: Add Heroku remote
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: heroku git:remote -a $HEROKU_APP_NAME

      - name: Deploy to Heroku
        run: git push heroku staging:main --force

  deploy_production:
    needs: [ci, payment-newman-regression]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Validate Docker Hub configuration
        run: |
          test -n "${{ vars.DOCKERHUB_REPOSITORY }}" || (echo "Missing repository variable DOCKERHUB_REPOSITORY (example: username/mysawit-payment)" && exit 1)
          test -n "${{ secrets.DOCKERHUB_USERNAME }}" || (echo "Missing secret DOCKERHUB_USERNAME" && exit 1)
          test -n "${{ secrets.DOCKERHUB_TOKEN }}" || (echo "Missing secret DOCKERHUB_TOKEN" && exit 1)

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate blue/green deployment configuration
        run: |
          test -n "${{ secrets.EC2_BLUE_HOST }}" || (echo "Missing secret EC2_BLUE_HOST" && exit 1)
          test -n "${{ secrets.EC2_GREEN_HOST }}" || (echo "Missing secret EC2_GREEN_HOST" && exit 1)
          test -n "${{ secrets.EC2_USERNAME }}" || (echo "Missing secret EC2_USERNAME" && exit 1)
          test -n "${{ secrets.EC2_SSH_PRIVATE_KEY }}" || (echo "Missing secret EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "${{ vars.AWS_REGION }}" || (echo "Missing variable AWS_REGION" && exit 1)
          test -n "${{ vars.ALB_PAYMENT_RULE_ARN }}" || (echo "Missing variable ALB_PAYMENT_RULE_ARN" && exit 1)
          test -n "${{ vars.TG_PAYMENT_BLUE_ARN }}" || (echo "Missing variable TG_PAYMENT_BLUE_ARN" && exit 1)
          test -n "${{ vars.TG_PAYMENT_GREEN_ARN }}" || (echo "Missing variable TG_PAYMENT_GREEN_ARN" && exit 1)

      - name: Prepare SSH key for control-plane commands
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > /tmp/ec2_ssh_key
          chmod 600 /tmp/ec2_ssh_key

      - name: Plan blue/green target
        id: route_plan
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ALB_RULE_ARN: ${{ vars.ALB_PAYMENT_RULE_ARN }}
          TG_BLUE_ARN: ${{ vars.TG_PAYMENT_BLUE_ARN }}
          TG_GREEN_ARN: ${{ vars.TG_PAYMENT_GREEN_ARN }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          CONTROL_HOST: ${{ secrets.EC2_BLUE_HOST }}
          EC2_BLUE_HOST: ${{ secrets.EC2_BLUE_HOST }}
          EC2_GREEN_HOST: ${{ secrets.EC2_GREEN_HOST }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          ssh $SSH_OPTS -i /tmp/ec2_ssh_key "$EC2_USERNAME@$CONTROL_HOST" \
            "aws elbv2 describe-rules --region '$AWS_REGION' --rule-arns '$ALB_RULE_ARN' --output json" \
            > /tmp/alb-rule.json
          python - <<'PY'
          import json
          import os
          import sys

          with open("/tmp/alb-rule.json", "r", encoding="utf-8") as fh:
              payload = json.load(fh)

          rule = payload["Rules"][0]
          forward_actions = [action for action in rule.get("Actions", []) if action.get("Type") == "forward"]
          if not forward_actions:
              print("No forward action found in ALB rule", file=sys.stderr)
              sys.exit(1)

          target_groups = forward_actions[0].get("ForwardConfig", {}).get("TargetGroups", [])
          weights = {tg.get("TargetGroupArn"): int(tg.get("Weight", 0)) for tg in target_groups}

          blue_arn = os.environ["TG_BLUE_ARN"]
          green_arn = os.environ["TG_GREEN_ARN"]

          if blue_arn not in weights or green_arn not in weights:
              print("ALB rule must include both blue and green target groups", file=sys.stderr)
              sys.exit(1)

          blue_weight = weights[blue_arn]
          green_weight = weights[green_arn]

          if blue_weight > green_weight:
              current_live = "blue"
              deploy_target = "green"
              target_host = os.environ["EC2_GREEN_HOST"]
          elif green_weight > blue_weight:
              current_live = "green"
              deploy_target = "blue"
              target_host = os.environ["EC2_BLUE_HOST"]
          else:
              print("Cannot infer live color when blue and green weights are equal", file=sys.stderr)
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"current_live={current_live}\n")
              fh.write(f"deploy_target={deploy_target}\n")
              fh.write(f"target_host={target_host}\n")
          PY

      - name: Deploy container to target color via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}:sha-${{ github.sha }}
          CONTAINER_NAME: ${{ vars.EC2_CONTAINER_NAME || 'payment-app' }}
          HOST_PORT: ${{ vars.EC2_HOST_PORT || '8002' }}
          CONTAINER_PORT: ${{ vars.EC2_CONTAINER_PORT || '8002' }}
          DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR || '/opt/payment' }}
          ENV_FILE_PATH: ${{ vars.EC2_ENV_FILE_PATH || '/opt/payment/.env' }}
          HEALTHCHECK_URL: ${{ vars.EC2_HEALTHCHECK_URL || '' }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE || 'prod' }}
          SERVER_PORT: ${{ vars.SERVER_PORT || '8002' }}
          DATABASE_URL: ${{ vars.DATABASE_URL || '' }}
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME || '' }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD || '' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || '' }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY || '' }}
          XENDIT_WEBHOOK_TOKEN: ${{ secrets.XENDIT_WEBHOOK_TOKEN || '' }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || '' }}
          INTERNAL_PATH_PREFIX: ${{ vars.INTERNAL_PATH_PREFIX || '/api/v1/internal' }}
        with:
          host: ${{ steps.route_plan.outputs.target_host }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT,DEPLOY_DIR,ENV_FILE_PATH,HEALTHCHECK_URL,SPRING_PROFILES_ACTIVE,SERVER_PORT,DATABASE_URL,DATABASE_USERNAME,DATABASE_PASSWORD,JWT_SECRET,XENDIT_SECRET_KEY,XENDIT_WEBHOOK_TOKEN,INTERNAL_API_KEY,INTERNAL_PATH_PREFIX
          script: |
            set -euo pipefail
            docker compose version >/dev/null 2>&1 || (echo "docker compose plugin is required on EC2 host" && exit 1)

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"

            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            : > .runtime.env
            for key in SPRING_PROFILES_ACTIVE SERVER_PORT DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET XENDIT_SECRET_KEY XENDIT_WEBHOOK_TOKEN INTERNAL_API_KEY INTERNAL_PATH_PREFIX; do
              val="${!key:-}"
              if [ -n "$val" ]; then
                printf '%s=%s\n' "$key" "$val" >> .runtime.env
              fi
            done

            cat > docker-compose.yml <<EOF
            services:
              app:
                image: ${IMAGE}
                container_name: ${CONTAINER_NAME}
                restart: unless-stopped
                ports:
                  - "${HOST_PORT}:${CONTAINER_PORT}"
            EOF

            if [ -n "${ENV_FILE_PATH:-}" ] && [ -f "$ENV_FILE_PATH" ]; then
              echo "Using env file: $ENV_FILE_PATH"
              cat >> docker-compose.yml <<EOF
                env_file:
                  - ${ENV_FILE_PATH}
                  - ./.runtime.env
            EOF
            else
              echo "ENV file not found or not set; deploying with GitHub-provided env only"
              cat >> docker-compose.yml <<'EOF'
                env_file:
                  - ./.runtime.env
            EOF
            fi

            docker compose pull app
            docker compose up -d --force-recreate app

            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              echo "Container is not running"
              docker compose ps
              docker compose logs --tail 200 app || true
              exit 1
            fi

            if [ -n "${HEALTHCHECK_URL}" ]; then
              i=1
              until [ "$i" -gt 12 ]
              do
                if curl -fsS --max-time 5 "$HEALTHCHECK_URL" >/dev/null; then
                  echo "Healthcheck passed: $HEALTHCHECK_URL"
                  break
                fi
                if [ "$i" -eq 12 ]; then
                  echo "Healthcheck failed: $HEALTHCHECK_URL"
                  docker compose logs --tail 200 app || true
                  exit 1
                fi
                sleep 5
                i=$((i+1))
              done
            fi

            docker image prune -f

      - name: Switch 100% traffic to deployed color
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          CONTROL_HOST: ${{ secrets.EC2_BLUE_HOST }}
          ALB_RULE_ARN: ${{ vars.ALB_PAYMENT_RULE_ARN }}
          TG_BLUE_ARN: ${{ vars.TG_PAYMENT_BLUE_ARN }}
          TG_GREEN_ARN: ${{ vars.TG_PAYMENT_GREEN_ARN }}
          DEPLOY_TARGET: ${{ steps.route_plan.outputs.deploy_target }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_TARGET" = "blue" ]; then
            TARGET_TG_ARN="$TG_BLUE_ARN"
            BLUE_WEIGHT=100
            GREEN_WEIGHT=0
          else
            TARGET_TG_ARN="$TG_GREEN_ARN"
            BLUE_WEIGHT=0
            GREEN_WEIGHT=100
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          ssh $SSH_OPTS -i /tmp/ec2_ssh_key "$EC2_USERNAME@$CONTROL_HOST" \
            "AWS_REGION='$AWS_REGION' TARGET_TG_ARN='$TARGET_TG_ARN' bash -se" <<'EOF'
          set -euo pipefail
          timeout_secs=300
          sleep_secs=10
          waited=0

          while [ "$waited" -lt "$timeout_secs" ]; do
            health_json="$(aws elbv2 describe-target-health --region "$AWS_REGION" --target-group-arn "$TARGET_TG_ARN" --output json)"
            total="$(printf '%s' "$health_json" | jq '.TargetHealthDescriptions | length')"
            healthy="$(printf '%s' "$health_json" | jq '[.TargetHealthDescriptions[] | select(.TargetHealth.State=="healthy")] | length')"

            if [ "$total" -gt 0 ] && [ "$healthy" -eq "$total" ]; then
              echo "Target group healthy: $healthy/$total"
              exit 0
            fi

            echo "Waiting target group healthy: $healthy/$total"
            sleep "$sleep_secs"
            waited=$((waited + sleep_secs))
          done

          echo "Timed out waiting for target group health"
          echo "$health_json"
          exit 1
          EOF

          ssh $SSH_OPTS -i /tmp/ec2_ssh_key "$EC2_USERNAME@$CONTROL_HOST" \
            "AWS_REGION='$AWS_REGION' ALB_RULE_ARN='$ALB_RULE_ARN' TG_BLUE_ARN='$TG_BLUE_ARN' TG_GREEN_ARN='$TG_GREEN_ARN' BLUE_WEIGHT='$BLUE_WEIGHT' GREEN_WEIGHT='$GREEN_WEIGHT' bash -se" <<'EOF'
          cat > /tmp/alb-actions-switch.json <<JSON
          [{
            "Type":"forward",
            "ForwardConfig":{
              "TargetGroups":[
                {"TargetGroupArn":"${TG_BLUE_ARN}","Weight":${BLUE_WEIGHT}},
                {"TargetGroupArn":"${TG_GREEN_ARN}","Weight":${GREEN_WEIGHT}}
              ]
            }
          }]
          JSON

          aws elbv2 modify-rule \
            --region "$AWS_REGION" \
            --rule-arn "$ALB_RULE_ARN" \
            --actions file:///tmp/alb-actions-switch.json
          EOF

      - name: Smoke test production endpoint after switch
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_SMOKE_URL || 'https://api.sushiikan.me/api/v1/wallets' }}
          EXPECTED_STATUS: ${{ vars.PRODUCTION_SMOKE_EXPECTED_STATUS || '401' }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SMOKE_URL")"
          echo "Smoke URL: $SMOKE_URL"
          echo "HTTP status: $status"
          if [ "$status" != "$EXPECTED_STATUS" ]; then
            echo "Unexpected smoke test status: expected $EXPECTED_STATUS, got $status"
            exit 1
          fi

      - name: Roll back ALB traffic to original live color on failure
        if: failure() && steps.route_plan.outputs.current_live != ''
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          CONTROL_HOST: ${{ secrets.EC2_BLUE_HOST }}
          ALB_RULE_ARN: ${{ vars.ALB_PAYMENT_RULE_ARN }}
          TG_BLUE_ARN: ${{ vars.TG_PAYMENT_BLUE_ARN }}
          TG_GREEN_ARN: ${{ vars.TG_PAYMENT_GREEN_ARN }}
          CURRENT_LIVE: ${{ steps.route_plan.outputs.current_live }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_LIVE" = "blue" ]; then
            BLUE_WEIGHT=100
            GREEN_WEIGHT=0
          else
            BLUE_WEIGHT=0
            GREEN_WEIGHT=100
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          ssh $SSH_OPTS -i /tmp/ec2_ssh_key "$EC2_USERNAME@$CONTROL_HOST" \
            "AWS_REGION='$AWS_REGION' ALB_RULE_ARN='$ALB_RULE_ARN' TG_BLUE_ARN='$TG_BLUE_ARN' TG_GREEN_ARN='$TG_GREEN_ARN' BLUE_WEIGHT='$BLUE_WEIGHT' GREEN_WEIGHT='$GREEN_WEIGHT' bash -se" <<'EOF'
          cat > /tmp/alb-actions-rollback.json <<JSON
          [{
            "Type":"forward",
            "ForwardConfig":{
              "TargetGroups":[
                {"TargetGroupArn":"${TG_BLUE_ARN}","Weight":${BLUE_WEIGHT}},
                {"TargetGroupArn":"${TG_GREEN_ARN}","Weight":${GREEN_WEIGHT}}
              ]
            }
          }]
          JSON

          aws elbv2 modify-rule \
            --region "$AWS_REGION" \
            --rule-arn "$ALB_RULE_ARN" \
            --actions file:///tmp/alb-actions-rollback.json
          EOF
